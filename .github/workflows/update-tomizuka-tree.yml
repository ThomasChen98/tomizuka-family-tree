# The family tree moved to tomi80th/tomizukafest (family-tree/), together
# with its 10-minute auto-update pipeline. This repo only serves redirect
# stubs now; pushes here just redeploy them.
name: Deploy redirect stubs

on:
  workflow_dispatch: {}
  push:
    branches: [gh-pages]

permissions:
  pages: write
  id-token: write

concurrency:
  group: tree-update
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
