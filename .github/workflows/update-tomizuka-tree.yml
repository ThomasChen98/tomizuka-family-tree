name: Update Tomizuka family tree

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may add a few minutes of jitter)
  workflow_dispatch: {}       # manual "refresh now" button
  push:
    branches: [gh-pages]      # code pushes deploy too

concurrency:
  group: tree-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Google Apps Script web-app URL — GET returns responses as CSV (no emails)
      SURVEY_CSV_URL: 'https://script.google.com/macros/s/AKfycbynzOtTM7IpW38e0ygxmRwPTsQesQJqwQx7i6vpFMXPo9cfgyoBCAocYyIWSEU5at89/exec'
    steps:
      - uses: actions/checkout@v4

      - name: Pull live survey responses
        run: |
          if [ -n "$SURVEY_CSV_URL" ]; then
            curl -sL --max-time 60 "$SURVEY_CSV_URL" -o /tmp/live_responses.csv || true
            echo "live rows: $(wc -l < /tmp/live_responses.csv 2>/dev/null || echo 0)"
          else
            echo "SURVEY_CSV_URL not set — committed data only."
          fi

      - name: Rebuild tree data
        run: |
          ARGS="--base data/base.json --survey data/sample_responses.csv"
          if [ -s /tmp/live_responses.csv ]; then
            ARGS="$ARGS --survey /tmp/live_responses.csv"
          fi
          echo "BUILD_ARGS=$ARGS" >> "$GITHUB_ENV"
          python3 scripts/build_data.py $ARGS

      - name: Ingest survey photos (blocklist enforced)
        run: |
          pip3 install --quiet pillow
          if [ -s /tmp/live_responses.csv ]; then
            python3 scripts/ingest_photos.py /tmp/live_responses.csv
          else
            python3 scripts/ingest_photos.py
          fi
          # photo files may have changed -> refresh photo paths in the data
          python3 scripts/build_data.py $BUILD_ARGS

      - name: Commit if changed
        run: |
          git config user.name "tomi-tree-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tree.js photos
          git add data/needs-review.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-update family tree data"
            git push
          fi

      # GITHUB_TOKEN pushes do NOT trigger the branch-based Pages build,
      # so this workflow deploys the site itself (Pages source: GitHub Actions).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
